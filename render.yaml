# Render Blueprint: one click deploy of the paper trading bot (paper-bot/).
# Secrets are generated by Render itself; nobody types or shares them.
services:
  - type: web
    name: paperbot
    runtime: python
    rootDir: paper-bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: TEST_MODE
        value: "true"
      - key: STARTING_BALANCE
        value: "10000"
      - key: FEE_RATE
        value: "0.001"
      - key: DEFAULT_ORDER_USD
        value: "1000"
      - key: MAX_ORDER_USD
        value: "2000"
      - key: MAX_DAILY_LOSS_USD
        value: "300"
      - key: DEFAULT_STOP_LOSS_PCT
        value: "2"
      - key: TIMEZONE
        value: America/New_York
